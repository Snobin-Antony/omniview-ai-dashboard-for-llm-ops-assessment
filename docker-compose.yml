services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: omniview
      POSTGRES_PASSWORD: omniview
      POSTGRES_DB: omniview
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omniview -d omniview"]
      interval: 3s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
